<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Day as Someone</title>
        <style>
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
            body {
                font-family: system-ui, sans-serif;
                height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
                padding: 3rem 1rem;
            }
            #container {
                width: 100%;
                max-width: 900px;
                display: flex;
                flex-direction: column;
                border: 1px solid #e0e0e0;
            }
            #intro {
                padding: 1.5rem 2rem;
                border-bottom: 1px solid #e0e0e0;
            }
            #intro h1 { font: 500 1.8rem/1.2 Georgia, serif; margin-bottom: .35rem; }
            #intro p { color: #666; line-height: 1.5; }
            #quick-start { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: 1rem; }
            .persona {
                padding: .5rem .7rem;
                color: #333;
                background: #f4f1ea;
                border: 1px solid #ddd5c8;
                text-transform: none;
                letter-spacing: 0;
                font-size: .8rem;
            }
            #neighborhood {
                margin-top: 1rem;
                padding: .5rem;
                border: 1px solid #ddd;
                background: white;
            }
            #messages {
                overflow-y: auto;
                padding: 2rem;
                display: flex;
                flex-direction: column;
                gap: 1.5rem;
                min-height: 450px;
                max-height: 70vh;
            }
            .msg {
                line-height: 1.5;
                max-width: 80%;
            }
            .msg.user {
                align-self: flex-end;
                text-align: right;
            }
            .msg .role {
                font-size: 0.75rem;
                text-transform: uppercase;
                letter-spacing: 0.05em;
                color: #999;
                margin-bottom: 0.25rem;
            }
            .msg.loading .content {
                color: #999;
            }
            #input-area {
                display: flex;
                gap: 1rem;
                padding: 1.5rem;
                border-top: 1px solid #e0e0e0;
            }
            #user-input {
                flex: 1;
                padding: 0.75rem 0;
                border: none;
                border-bottom: 1px solid #e0e0e0;
                font-size: 1rem;
                outline: none;
            }
            #user-input:focus {
                border-bottom-color: #000;
            }
            button {
                padding: 0.75rem 1.5rem;
                background: #000;
                color: #fff;
                border: none;
                font-size: 0.75rem;
                text-transform: uppercase;
                letter-spacing: 0.05em;
                cursor: pointer;
            }
            .tool {
                font-family: ui-monospace, monospace;
                font-size: 0.75rem;
                color: #555;
                background: #f5f5f5;
                border-left: 3px solid #f59e0b;
                padding: 0.5rem 0.75rem;
                margin: 0.25rem 0 0.75rem;
                white-space: pre-wrap;
                word-break: break-word;
            }
            .tool .label {
                text-transform: uppercase;
                letter-spacing: 0.05em;
                color: #b45309;
            }
            button:disabled {
                opacity: 0.3;
            }
        </style>
    </head>
    <body>
        <div id="container">
            <section id="intro">
                <h1>Day as Someone</h1>
                <p>Choose a ready-made persona or describe your own. The agent turns it into a real, themed NYC micro-adventure.</p>
                <select id="neighborhood" aria-label="Neighborhood">
                    <option>Morningside Heights</option>
                    <option>Greenwich Village</option>
                    <option>Chinatown</option>
                    <option>DUMBO</option>
                </select>
                <div id="quick-start">
                    <button class="persona" data-persona="struggling novelist">Struggling novelist</button>
                    <button class="persona" data-persona="urban detective">Urban detective</button>
                    <button class="persona" data-persona="indie filmmaker">Indie filmmaker</button>
                    <button class="persona" data-persona="architecture apprentice">Architecture apprentice</button>
                    <button class="persona" data-persona="city naturalist">City naturalist</button>
                    <button class="persona" data-persona="independent magazine editor">Magazine editor</button>
                    <button class="persona" data-persona="jazz age drifter">Jazz age drifter</button>
                    <button class="persona" data-persona="street photographer">Street photographer</button>
                    <button class="persona" data-persona="hidden history archivist">History archivist</button>
                    <button class="persona" data-persona="thrift fashion scout">Thrift fashion scout</button>
                    <button class="persona" data-persona="neighborhood food chronicler">Food chronicler</button>
                    <button class="persona" data-persona="waterfront poet">Waterfront poet</button>
                    <button class="persona" data-persona="campus intellectual">Campus intellectual</button>
                    <button class="persona" data-persona="avant garde theater actor">Avant-garde actor</button>
                    <button class="persona" data-persona="urban sketch artist">Urban sketch artist</button>
                    <button class="persona" data-persona="community radio producer">Radio producer</button>
                    <button class="persona" data-persona="romantic city wanderer">Romantic wanderer</button>
                    <button class="persona" data-persona="industrial design student">Industrial designer</button>
                    <button class="persona" data-persona="museum time traveler">Museum time traveler</button>
                    <button class="persona" data-persona="midnight mystery writer">Mystery writer</button>
                </div>
            </section>
            <div id="messages"></div>
            <div id="input-area">
                <input
                    type="text"
                    id="user-input"
                    placeholder="Or describe your own persona, time, and preferences..."
                    autocomplete="off"
                />
                <button id="send-btn">Send</button>
            </div>
        </div>
        <script>
            const messages = document.getElementById("messages");
            const userInput = document.getElementById("user-input");
            const sendBtn = document.getElementById("send-btn");
            let sessionId = null;

            function addMessage(role, text, isLoading = false) {
                const div = document.createElement("div");
                div.className =
                    "msg " +
                    (role === "you" ? "user" : "assistant") +
                    (isLoading ? " loading" : "");
                div.innerHTML =
                    '<div class="role">' +
                    role +
                    '</div><div class="content">' +
                    text +
                    "</div>";
                messages.appendChild(div);
                messages.scrollTop = messages.scrollHeight;
                return div;
            }

            async function send() {
                const text = userInput.value.trim();
                if (!text) return;

                userInput.value = "";
                sendBtn.disabled = true;
                addMessage("you", text);
                const loading = addMessage("assistant", "Thinking...", true);

                try {
                    const res = await fetch("/chat", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            message: text,
                            session_id: sessionId,
                        }),
                    });
                    const data = await res.json();
                    sessionId = data.session_id;

                    // Show each tool the harness ran, above the assistant's answer
                    for (const call of data.tool_calls || []) {
                        const div = document.createElement("div");
                        div.className = "tool";
                        const label = document.createElement("span");
                        label.className = "label";
                        label.textContent = "tool call  ";
                        div.appendChild(label);
                        div.appendChild(
                            document.createTextNode(
                                call.name + "(" + JSON.stringify(call.args) + ")\n→ " + call.result,
                            ),
                        );
                        messages.insertBefore(div, loading);
                    }
                    loading.querySelector(".content").textContent =
                        data.response;
                    loading.classList.remove("loading");
                } catch (e) {
                    loading.querySelector(".content").textContent =
                        "Error: " + e.message;
                    loading.classList.remove("loading");
                }
                sendBtn.disabled = false;
                userInput.focus();
            }

            sendBtn.addEventListener("click", send);
            document.querySelectorAll(".persona").forEach((button) => {
                button.addEventListener("click", () => {
                    const neighborhood = document.getElementById("neighborhood").value;
                    userInput.value = `Plan a two-hour SideQuest as a ${button.dataset.persona} in ${neighborhood}.`;
                    userInput.focus();
                });
            });
            userInput.addEventListener("keydown", function (e) {
                if (e.key === "Enter") send();
            });
            userInput.focus();
        </script>
    </body>
</html>
